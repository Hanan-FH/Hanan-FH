<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="100%" height="50" fill="none">
  <!-- Center Accent Geometry -->
  <line x1="0" y1="25" x2="380" y2="25" stroke="#171B24" stroke-width="1" />
  <line x1="500" y1="25" x2="880" y2="25" stroke="#171B24" stroke-width="1" />

  <!-- Center Diamond Badge -->
  <g transform="translate(440, 25)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#0C121A" stroke="#00D1FF" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#00D1FF">
      <animate attributeName="r" values="2;3.5;2" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Side Nodes with Subtle Pulsing -->
  <circle cx="380" cy="25" r="2" fill="#00D1FF" opacity="0.6" />
  <circle cx="500" cy="25" r="2" fill="#00D1FF" opacity="0.6" />

  <!-- Bottom Coordinates Label -->
  <text x="440" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#4B5568" letter-spacing="0.1em" text-anchor="middle">
    EOF // HANAN FATHURROZAQ HIDAYATULLAH · BOGOR, INDONESIA
  </text>
</svg>
