          <rect x="1416" y="33" width="13" height="7" rx="1" />
          <rect x="1438" y="33" width="13" height="7" rx="1" />
          <rect x="1460" y="33" width="13" height="7" rx="1" />
          <rect x="1482" y="33" width="13" height="7" rx="1" />
          <rect x="1504" y="33" width="13" height="7" rx="1" />
          <rect x="1526" y="33" width="13" height="7" rx="1" />
          <rect x="1548" y="33" width="13" height="7" rx="1" />

          <!-- Car 1 Lead Windows + Cockpit Slit -->
          <rect x="1594" y="33" width="13" height="7" rx="1" />
          <rect x="1616" y="33" width="13" height="7" rx="1" />
          <rect x="1638" y="33" width="13" height="7" rx="1" />
          <rect x="1660" y="33" width="13" height="7" rx="1" />
          <path d="M1686 28.5 L1714 33.5 L1709 38.2 L1683 33.8 Z" />
        </g>
      </g>
    </g>
  </g>
</svg>
