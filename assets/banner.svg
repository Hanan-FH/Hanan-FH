<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>

    <!-- Cyan Accent Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D1FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00D1FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#202634" />
    </pattern>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect x="0.5" y="0.5" width="879" height="199" rx="8" fill="url(#bg-grad)" stroke="#191D26" stroke-width="1" />
  <rect x="1" y="1" width="878" height="198" rx="7" fill="url(#grid-dots)" />

  <!-- Animated Ambient Constellation Nodes -->
  <circle cx="120" cy="48" r="1.5" fill="#00D1FF">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="340" cy="160" r="2" fill="#00D1FF">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" begin="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="54" r="1.5" fill="#00D1FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="150" r="1.8" fill="#00D1FF">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" begin="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(32, 28)">
    <!-- Animated Status Beacon -->
    <circle cx="6" cy="6" r="4" fill="#10B981">
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="6" cy="6" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite" />
    </circle>

    <text x="22" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#00D1FF" letter-spacing="0.1em">SYSTEM.ONLINE // HANAN-FH.DEV</text>
    <text x="740" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#606B82" letter-spacing="0.08em" text-anchor="end">LOC: BOGOR, ID · UTC+7</text>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="46" x2="848" y2="46" stroke="#171B24" stroke-width="1" />

  <!-- Centerpiece: Developer Identity -->
  <g transform="translate(32, 88)">
    <!-- Monogram Graphic Mark -->
    <rect x="0" y="0" width="56" height="56" rx="6" fill="#0E131C" stroke="#00D1FF" stroke-width="1.5" filter="url(#cyan-glow)" />
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>

    <!-- Main Name Title -->
    <text x="74" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
      Hanan Fathurrozaq Hidayatullah
    </text>

    <!-- Subtitle Role with Blinking Terminal Cursor -->
    <text x="74" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#8E99AF" letter-spacing="0.02em">
      Software Engineering Student · SMK Plus Pelita Nusantara
    </text>
    <rect x="525" y="40" width="7" height="13" fill="#00D1FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Bottom Accent Boundary & Traveling Light Beam -->
  <line x1="32" y1="166" x2="848" y2="166" stroke="#171B24" stroke-width="1" />
  
  <line x1="0" y1="166" x2="120" y2="166" stroke="url(#beam-grad)" stroke-width="1.5">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-150 0"
      to="880 0"
      dur="3.8s"
      repeatCount="indefinite"
    />
  </line>

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(32, 178)">
    <text x="0" y="6" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#505A6F" letter-spacing="0.06em">
      STACK: TYPESCRIPT · REACT · PYTHON · GDSCRIPT · PHP · SQL
    </text>
    <text x="816" y="6" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" fill="#00D1FF" letter-spacing="0.08em" text-anchor="end">
      • REKAYASA PERANGKAT LUNAK (RPL)
    </text>
  </g>
</svg>
