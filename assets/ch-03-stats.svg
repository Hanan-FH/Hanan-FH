<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 54" width="100%" height="100%" fill="none" role="img" aria-label="CH.03 // TELEMETRY — Activity and GitHub Metrics">
  <style>
    .f-display {
      font-family: 'Archivo Black', 'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }
    .f-mono {
      font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase;
    }
    .f-kanji {
      font-family: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'MS PMincho', serif;
      font-weight: 900;
    }
  </style>

  <!-- Outer Paper Accent Backing for Diagonal Cut Contrast on Both Dark & Light Themes -->
  <rect x="0" y="0" width="1000" height="54" fill="#ECECF0" />

  <!-- Pitch-Black (#060608) Diagonal-Cut Chapter Strip Bar -->
  <polygon points="0,0 988,0 1000,54 12,54" fill="#060608" />

  <!-- Left Electric-Violet (#584CE6) Slash Edge -->
  <polygon points="0,0 16,0 28,54 12,54" fill="#584CE6" />

  <!-- Bottom Electric-Violet Hairline Seam -->
  <line x1="12" y1="53" x2="1000" y2="53" stroke="#584CE6" stroke-width="2" />

  <!-- Tilted #584CE6 Chapter Badge: CH.03 // TELEMETRY -->
  <g transform="translate(44, 15)">
    <g transform="rotate(-1.6 78 12)">
      <rect x="0" y="0" width="156" height="24" fill="#584CE6" />
      <text x="78" y="16" class="f-mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.4">
        CH.03 // TELEMETRY
      </text>
    </g>
    <!-- Framed Kanji Stamp 参 -->
    <rect x="166" y="0" width="24" height="24" fill="none" stroke="#ECECF0" stroke-width="1.2" opacity="0.85" />
    <text x="178" y="17" class="f-kanji" font-size="13.5" fill="#ECECF0" text-anchor="middle">参</text>
  </g>

  <!-- Bold White Uppercase Chapter Title -->
  <text x="254" y="35" class="f-display" font-size="22" fill="#ECECF0" letter-spacing="-0.4">
    ACTIVITY &amp; GITHUB METRICS
  </text>

  <!-- Right Side Watermark Numeral 03 & Formal Kanji 参 -->
  <text x="892" y="45" class="f-display" font-size="44" fill="#ECECF0" opacity="0.08" text-anchor="end" letter-spacing="-2">03</text>
  <text x="936" y="36" class="f-mono" font-size="10" font-weight="600" fill="#A6A6B2" text-anchor="end" letter-spacing="1.5">
    ARCHIVE <tspan fill="#584CE6">//</tspan>
  </text>
  <text x="968" y="38" class="f-kanji" font-size="24" fill="#584CE6" text-anchor="end">参</text>
</svg>
