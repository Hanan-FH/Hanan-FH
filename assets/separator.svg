<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 24" width="100%" height="24" fill="none">
  <!-- Subtle Track Line -->
  <line x1="0" y1="12" x2="880" y2="12" stroke="#1A1E26" stroke-width="1" />
  
  <!-- Left and Right Terminal Anchor Points -->
  <circle cx="6" cy="12" r="2.5" fill="#00D1FF" opacity="0.6" />
  <circle cx="874" cy="12" r="2.5" fill="#00D1FF" opacity="0.6" />

  <!-- Animated Traveling Light Pulse -->
  <line x1="0" y1="12" x2="80" y2="12" stroke="url(#pulse-gradient)" stroke-width="1.5">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-100 0"
      to="900 0"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </line>

  <!-- Glowing Leading Head of Pulse -->
  <circle r="2" fill="#00D1FF">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-20 12"
      to="880 12"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </circle>

  <defs>
    <linearGradient id="pulse-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D1FF" stop-opacity="0" />
      <stop offset="60%" stop-color="#00D1FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
  </defs>
</svg>
