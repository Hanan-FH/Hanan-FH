<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%" fill="none" role="img" aria-label="Hanan Fathurrozaq Hidayatullah">
  <defs>
    <!-- Fine dot halftone pattern -->
    <pattern id="halftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4F4F4" />
    </pattern>

    <!-- Soft horizontal fade mask for right-side halftone -->
    <linearGradient id="halftone-fade" x1="560" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <mask id="right-fade-mask">
      <rect x="560" y="0" width="440" height="220" fill="url(#halftone-fade)" />
    </mask>

    <clipPath id="canvas-clip">
      <rect x="0" y="0" width="1000" height="220" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.025em;
    }
    .mono {
      font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* Subtle monochrome lightning flicker once every 6s */
    .bolt-main {
      opacity: 0;
      animation: bolt-flicker 6s steps(1, end) -4.2s infinite;
    }
    .bolt-branch {
      opacity: 0;
      animation: branch-flicker 6s steps(1, end) -4.2s infinite;
    }

    @keyframes bolt-flicker {
      0%, 88% { opacity: 0; }
      88.5%, 90.2% { opacity: 0.9; }
      90.3%, 91.5% { opacity: 0.15; }
      91.6%, 94.2% { opacity: 1; }
      94.3%, 95.8% { opacity: 0.45; }
      95.9%, 100% { opacity: 0; }
    }

    @keyframes branch-flicker {
      0%, 91.5% { opacity: 0; }
      91.6%, 94.5% { opacity: 0.75; }
      94.6%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bolt-main {
        animation: none !important;
        opacity: 0.35 !important;
      }
      .bolt-branch {
        animation: none !important;
        opacity: 0.2 !important;
      }
    }
  </style>

  <g clip-path="url(#canvas-clip)">
    <!-- Deep Matte Black Canvas (#0A0A0A) -->
    <rect x="0" y="0" width="1000" height="220" fill="#0A0A0A" />

    <!-- Barely-visible fine dot halftone gradient fading softly on the right edge -->
    <rect x="560" y="0" width="440" height="220" fill="url(#halftone)" mask="url(#right-fade-mask)" opacity="0.08" />

    <!-- Subtle Right Accent: Single Clean Diagonal White Ink Slash (1.5px) -->
    <line x1="896" y1="0" x2="778" y2="220" stroke="#262626" stroke-width="1" />
    <line x1="908" y1="0" x2="790" y2="220" stroke="#F4F4F4" stroke-width="1.5" stroke-opacity="0.72" />

    <!-- Subtle Monochrome Lightning Flicker Along Right Accent (Every 6s) -->
    <g class="bolt-main" stroke-linecap="square" stroke-linejoin="bevel">
      <path
        d="M892 18 L858 64 L874 61 L832 118 L848 115 L804 176 L816 173 L792 204"
        stroke="#737373"
        stroke-width="3"
        stroke-opacity="0.45"
      />
      <path
        d="M892 18 L858 64 L874 61 L832 118 L848 115 L804 176 L816 173 L792 204"
        stroke="#F4F4F4"
        stroke-width="1.35"
      />
    </g>
    <g class="bolt-branch" stroke="#F4F4F4" stroke-width="0.9" stroke-linecap="square" stroke-linejoin="bevel">
      <path d="M858 64 L828 80 L836 84 L812 102" />
      <path d="M848 115 L876 136 L866 140 L888 158" />
    </g>

    <!-- Left-Aligned Clean Typography -->
    <text x="52" y="88" class="title" font-size="31" fill="#F4F4F4">
      HANAN FATHURROZAQ HIDAYATULLAH
    </text>

    <text x="52" y="120" class="mono" font-size="13" font-weight="400" fill="#A3A3A3" letter-spacing="0.02em">
      Software Engineering Student · SMK Plus Pelita Nusantara · Bogor, ID
    </text>

    <!-- Subtle Hairline Rule -->
    <line x1="52" y1="152" x2="540" y2="152" stroke="#262626" stroke-width="1" />

    <!-- Minimal Bottom Meta Line -->
    <text x="52" y="176" class="mono" font-size="11.5" font-weight="500" fill="#737373" letter-spacing="0.06em">
      TypeScript · React · Python · GDScript · PHP · SQL
    </text>

    <!-- Crisp 1px Subtle Border (#262626) -->
    <rect x="0.5" y="0.5" width="999" height="219" stroke="#262626" stroke-width="1" />
  </g>
</svg>
